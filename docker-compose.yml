# Local stack that mirrors the production layout:
#   * 3-node Hadoop (HDFS) cluster: 1 NameNode + 2 DataNodes  -> raw landing zone
#   * Spark standalone cluster: 1 master + 2 workers           -> compute
#   * MinIO (S3-compatible)                                     -> lakehouse (swap for AWS S3)
#   * Airflow (LocalExecutor) + Postgres                        -> orchestration

x-airflow-common: &airflow-common
  build: ./docker/airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077
    PROJECT_DIR: /opt/project
    PYTHONPATH: /opt/project/src
    RAW_PATH: hdfs://namenode:9000/data/raw
    LAKEHOUSE_PATH: s3a://lakehouse
    S3_ENDPOINT: http://minio:9000
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin
    SPARK_DRIVER_HOST: airflow-scheduler
  volumes:
    - ./dags:/opt/airflow/dags
    - .:/opt/project
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ------------------------------------------------------------------ HDFS
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    environment:
      CLUSTER_NAME: lakehouse
    env_file: ./docker/hadoop.env
    ports: ["9870:9870"]
    volumes: [namenode:/hadoop/dfs/name]

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    hostname: datanode1
    env_file: ./docker/hadoop.env
    environment:
      SERVICE_PRECONDITION: namenode:9870
    volumes: [datanode1:/hadoop/dfs/data]
    depends_on: [namenode]

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode2
    hostname: datanode2
    env_file: ./docker/hadoop.env
    environment:
      SERVICE_PRECONDITION: namenode:9870
    volumes: [datanode2:/hadoop/dfs/data]
    depends_on: [namenode]

  # ------------------------------------------------------------------ Spark
  spark-master:
    image: spark:3.5.3-scala2.12-java17-python3-ubuntu
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      PYTHONPATH: /opt/project/src
    ports: ["8080:8080", "7077:7077"]
    volumes: [.:/opt/project]

  spark-worker-1: &spark-worker
    image: spark:3.5.3-scala2.12-java17-python3-ubuntu
    hostname: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 3g
    volumes: [.:/opt/project]
    depends_on: [spark-master]

  spark-worker-2:
    <<: *spark-worker
    hostname: spark-worker-2

  # ------------------------------------------------------------------ S3 (MinIO)
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/lakehouse;
      "

  # ------------------------------------------------------------------ Airflow
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    volumes: [postgres:/var/lib/postgresql/data]

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8081:8080"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    hostname: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  namenode:
  datanode1:
  datanode2:
  minio:
  postgres:
